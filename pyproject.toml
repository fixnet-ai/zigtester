[project]
name = "zigtester"
version = "0.24.0"
description = "fixnet 生态自动测试框架 — MCP 优先 + CLI 辅助"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "fixnet-ai"},
]
dependencies = [
    "pyyaml>=6.0",
    "fastmcp>=2.0.0",
    "requests>=2.28",
]
# psutil 为可选依赖 — monitor.py 在无 psutil 时优雅降级
[project.optional-dependencies]
monitor = ["psutil>=5.9"]

[project.scripts]
zigtester = "zigtester.cli:main"

[project.entry-points."mcp.server"]
zigtester = "zigtester.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
