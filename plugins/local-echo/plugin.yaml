name: local-echo
description: "统一 Go echo 服务(2026-08-17 重做):TCP+UDP :13333 + h2 :13335 + h3 :13336 + DNS :5533 — 单程序高性能"
build:
  command: "go build -o local-echo ."
lifecycle:
  start:
    command: "exec ./local-echo --tcp-port 13333 --dns-port 5533 --h2-port 13335 --h3-port 13336 --cert certs/localhost.crt --key certs/localhost.key"
    timeout: 10
    ready_on:
      type: tcp
      port: 13333
      host: "127.0.0.1"
  stop:
    timeout: 5
    kill:
      - "local-echo"
