name: local-echo
description: "TCP echo + DNS echo for proxy chain testing — 替代 zigbox --local-echo"
build:
  command: "true"
lifecycle:
  start:
    command: "sudo python3 echo_server.py --tcp-port 13333 --dns-port 53"
    timeout: 10
    ready_on:
      type: tcp
      port: 13333
      host: "127.0.0.1"
  stop:
    timeout: 5
    kill:
      - "echo_server"
