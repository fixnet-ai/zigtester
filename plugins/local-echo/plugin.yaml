name: local-echo
description: "TCP+UDP echo :13333 + h2 echo :13335 + h3 echo :13336 + DNS echo :5533 — 协议测试回环目标"
build:
  command: "cd h2h3 && go build -o ../h2h3-echo ."
lifecycle:
  start:
    command: "python3 echo_server.py --tcp-port 13333 --udp-echo-port 13333 --dns-port 5533 & exec ./h2h3-echo --h2-port 13335 --h3-port 13336 --cert certs/localhost.crt --key certs/localhost.key"
    timeout: 10
    ready_on:
      type: tcp
      port: 13333
      host: "127.0.0.1"
  stop:
    timeout: 5
    kill:
      - "echo_server"
      - "h2h3-echo"
