name: local-echo
description: "TCP+UDP echo :13333 + DNS echo :5533 — 协议测试回环目标，双栈，无需 sudo"
build:
  command: "true"
lifecycle:
  start:
    command: "python3 echo_server.py --tcp-port 13333 --udp-echo-port 13333 --dns-port 5533"
    timeout: 10
    ready_on:
      type: tcp
      port: 13333
      host: "127.0.0.1"
  stop:
    timeout: 5
    kill:
      - "echo_server"
