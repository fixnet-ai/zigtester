name: local-echo
description: "TCP echo :13333 + UDP echo :13334 — 协议测试回环目标，无需 sudo"
build:
  command: "true"
lifecycle:
  start:
    command: "python3 echo_server.py --tcp-port 13333 --udp-echo-port 13334 --no-dns"
    timeout: 10
    ready_on:
      type: tcp
      port: 13333
      host: "127.0.0.1"
  stop:
    timeout: 5
    kill:
      - "echo_server"
