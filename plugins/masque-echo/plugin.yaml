name: masque-echo
description: "CONNECT-IP (RFC 9643) echo 测试服务器（connect-ip-go 最小实现，阶段 31 MASQUE 联调目标）:UDP :13400 建 QUIC+H3 CONNECT-IP 隧道，AssignAddresses 分配 10.0.0.1/32 给客户端，IP 包原样回显；TCP :13401 readiness 探针"

# 端口真相源（生态级）: 本段是 masque-echo 全部命名端口的唯一权威。
# 各项目 tests/config.py 经 plugins/plugin_ports.py 从这里派生,禁止各自硬编码。
# lifecycle.start.command 用 ${PLUGIN_<KEY>:-<默认>} 引用本段(zigtester 注入
# PLUGIN_* 环境变量),保证运行命令与 config 段永不失步。
config:
  masque_port: 13400       # CONNECT-IP QUIC 监听（UDP）
  ready_port: 13401        # TCP readiness 探针（UDP 端口无法 TCP 探测，独立探针）
  assign_addr: "10.0.0.1/32"  # 分配给客户端的源 IPv4 前缀
  assign_addr6: "2001:db8::1/128"  # 分配给客户端的源 IPv6 前缀（对齐 mihomo Ipv6）
  # 证书复用 local-echo（生态统一 localhost 证书，SAN 含 DNS:localhost + IP:127.0.0.1）
  https_cert_path: "../local-echo/certs/localhost.crt"
  https_key_path: "../local-echo/certs/localhost.key"

# 监听端口列表 — 用于 zigtester 端口冲突预检 + 每套件前环境自检（端口归属校验）
ports:
  - 13400     # CONNECT-IP QUIC（UDP）
  - 13401     # readiness 探针（TCP）

build:
  command: "go build -o masque-echo ."
lifecycle:
  start:
    # 端口取自 config 段（zigtester 注入 PLUGIN_* 环境变量），${VAR:-默认} 兜底独立手动运行。
    command: "exec ./masque-echo --host 127.0.0.1 --port ${PLUGIN_MASQUE_PORT:-13400} --ready-port ${PLUGIN_READY_PORT:-13401} --cert ../local-echo/certs/localhost.crt --key ../local-echo/certs/localhost.key --assign ${PLUGIN_ASSIGN_ADDR:-10.0.0.1/32} --assign6 ${PLUGIN_ASSIGN_ADDR6:-2001:db8::1/128}"
    timeout: 10
    ready_on:
      type: tcp
      port: 13401
      host: "127.0.0.1"
  stop:
    timeout: 5
    kill:
      - "masque-echo"
